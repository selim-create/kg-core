name: Deploy KG Core

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: kg-core-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DEPLOY_HOST: 72.60.82.157
      DEPLOY_PORT: "65002"
      DEPLOY_USER: u399146576_hmrIbQ2w9
      DEPLOY_PATH: /home/u399146576/websites/hmrIbQ2w9/public_html/wp-content/plugins/kg-core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.KG_DEPLOY_SSH_KEY }}" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          if [ -z "${{ secrets.KG_DEPLOY_KNOWN_HOSTS }}" ]; then
            echo "::error::Set KG_DEPLOY_KNOWN_HOSTS using your verified local SSH known_hosts entry."
            exit 1
          fi
          printf '%s\n' "${{ secrets.KG_DEPLOY_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "[$DEPLOY_HOST]:$DEPLOY_PORT" -f "$HOME/.ssh/known_hosts" >/dev/null || {
            echo "::error::The pinned host key does not match the production hostname and port."
            exit 1
          }

      - name: Validate remote target
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -d '$DEPLOY_PATH' && test -w '$DEPLOY_PATH'"

      - name: Deploy plugin files
        shell: bash
        run: |
          set -euo pipefail
          rsync -az \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'docs/' \
            --exclude 'tests/' \
            --exclude 'node_modules/' \
            -e "ssh -o BatchMode=yes -p $DEPLOY_PORT" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Install production PHP dependencies
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "set -e
            cd '$DEPLOY_PATH'
            if command -v composer >/dev/null 2>&1 && [ -f composer.json ]; then
              composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
            fi
          "

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "set -e
            test -f '$DEPLOY_PATH/kg-core.php'
            if command -v php >/dev/null 2>&1; then
              php -l '$DEPLOY_PATH/kg-core.php'
              php -l '$DEPLOY_PATH/includes/Services/AIService.php'
            fi
          "
